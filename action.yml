name: 'AI Code Review'
description: 'Multi-agent AI code review system with Claude, GPT, and GLM'
branding:
  icon: 'check-circle'
  color: 'blue'

inputs:
  github-token:
    required: true
    description: 'GitHub token for API access'
  anthropic-api-key:
    required: false
    description: 'Anthropic API key for Claude models'
  openai-api-key:
    required: false
    description: 'OpenAI API key'
  glm-api-key:
    required: false
    description: 'GLM API key'
    
  # Label configuration (optional, with defaults)
  label-approved:
    description: 'Label to add when AI approves PR'
    required: false
    default: 'ai-approved'
  
  label-changes-requested:
    description: 'Label to add when AI requests changes'
    required: false
    default: 'ai-changes-requested'
  
  label-human-review:
    description: 'Label to add when AI defers to human'
    required: false
    default: 'human-review-needed'
    
runs:
  using: 'composite'
  steps:
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      shell: bash
      run: pip install -r ${{ github.action_path }}/requirements.txt
    
    - name: Run review
      id: review
      shell: bash
      run: |
        python ${{ github.action_path }}/scripts/review/review_pr.py \
          --output review-output.json
      continue-on-error: true
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        OPENAI_API_KEY: ${{ inputs.openai-api-key }}
        GLM_API_KEY: ${{ inputs.glm-api-key }}
    
    # Add labels based on review decision
    - name: Add review status labels
      if: always()
      uses: actions/github-script@v7
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const fs = require('fs');
          let decision = 'FAILED';
          try {
            const output = JSON.parse(fs.readFileSync('review-output.json', 'utf8'));
            decision = output.decision;
          } catch (error) {
            console.log('Could not read review output');
          }
          
          const pr_number = context.payload.pull_request.number;
          
          // Get label names from inputs (with defaults)
          const labelApproved = '${{ inputs.label-approved }}';
          const labelChanges = '${{ inputs.label-changes-requested }}';
          const labelHuman = '${{ inputs.label-human-review }}';
          
          // Remove old AI review labels
          const oldLabels = [labelApproved, labelChanges, labelHuman];
          for (const label of oldLabels) {
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr_number,
                name: label
              });
            } catch (error) {
              // Label might not exist, ignore
            }
          }
          
          // Add new label based on AI review decision
          let newLabel = labelHuman;  // Default to human review needed
          if (decision === 'APPROVE') {
            newLabel = labelApproved;
          } else if (decision === 'REQUEST_CHANGES') {
            newLabel = labelChanges;
          }
          
          await github.rest.issues.addLabels({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: pr_number,
            labels: [newLabel]
          });
          
          console.log(`✅ Added label: ${newLabel}`);
